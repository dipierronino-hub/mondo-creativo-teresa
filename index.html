const svg=s=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="white" stroke="black" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">${s}</svg>`;let favorites=[];try{favorites=JSON.parse(localStorage.getItem('teresa-fav')||'[]')}catch{}let only=false;const $=id=>document.getElementById(id);function render(){let n=0;$('grid').innerHTML='';data.forEach(([name,c,ages,s,instruction],i)=>{if(($('cat').value!=='Tutte'&&$('cat').value!==c)||($('age').value!=='all'&&!ages.includes(+$('age').value))||!name.toLowerCase().includes($('q').value.toLowerCase())||(only&&!favorites.includes(i)))return;n++;let a=document.createElement('article');a.innerHTML=svg(s)+`<h3>${name}</h3><small>${c} · ${ages.join(', ')} anni</small><p>${instruction||"Colora il disegno."}</p><div class="actions"><button onclick="printSheet(${i})">🖨 Stampa A4</button><button aria-label="Preferito" onclick="toggle(${i})">${favorites.includes(i)?'♥':'♡'}</button></div>`;$('grid').append(a)});$('count').textContent=n+' schede disponibili'}function toggle(i){favorites=favorites.includes(i)?favorites.filter(x=>x!==i):[...favorites,i];try{localStorage.setItem('teresa-fav',JSON.stringify(favorites))}catch{}render()}function printSheet(i){$('sheet').innerHTML=`<h2>${data[i][0]}</h2><p>Nome: __________________________</p><p>${data[i][4]||"Colora il disegno."}</p>${svg(data[i][3])}`;window.print()}$('cat').onchange=$('age').onchange=$('q').oninput=render;$('fav').onclick=()=>{only=!only;$('fav').textContent=only?'♥ Mostra tutte':'♡ Preferiti';render()};const nav=document.querySelector('.quick');const icons=['✦','🎄','🍃','🐻','✏️','♡','🎉','123','✂'];Array.from($('cat').options).forEach((o,i)=>{const b=document.createElement('button');b.textContent=icons[i]+' '+o.textContent;b.onclick=()=>{$('cat').value=o.value;render();syncNav()};b.dataset.cat=o.value;nav.append(b)});function syncNav(){nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===$('cat').value)))}$('cat').onchange=()=>{render();syncNav()};syncNav();render();</script><script>if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(console.error);</script></html>
