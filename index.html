const circle=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}"/>`;const path=d=>`<path d="${d}"/>`;const rect=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`;const star=(x,y)=>`<polygon points="${x},${y-24} ${x+7},${y-7} ${x+25},${y-7} ${x+11},${y+5} ${x+16},${y+23} ${x},${y+12} ${x-16},${y+23} ${x-11},${y+5} ${x-25},${y-7} ${x-7},${y-7}"/>`;const tree=rect(136,235,28,45)+path('M150 40 L95 120 H120 L65 180 H100 L40 240 H260 L200 180 H235 L180 120 H205 Z');const face=(m)=>circle(150,150,100)+circle(115,125,7)+circle(185,125,7)+path(m);const data=[['Albero di Natale','Natale',[3,4,5],tree+star(150,22)],['Albero con palline','Natale',[4,5],tree+circle(150,100,12)+circle(110,164,15)+circle(190,164,15)+circle(80,220,13)+circle(150,210,15)+circle(220,220,13)],['Regalo di Natale','Natale',[3,4,5],rect(55,115,190,140)+rect(40,85,220,35)+path('M135 85 V255 M165 85 V255 M150 85 C40 65 90 0 150 85 C210 0 260 65 150 85')],['Pupazzo di neve','Natale',[3,4,5],circle(150,205,65)+circle(150,95,48)+circle(135,85,4)+circle(165,85,4)+path('M150 98 L180 108 L150 115 Z M130 125 Q150 140 170 125')+circle(150,180,6)+circle(150,210,6)],['Foglia autunnale','Stagioni',[3,4,5],path('M150 270 V220 C25 200 40 75 150 25 C260 75 275 200 150 220 M150 65 V220 M150 150 L95 100 M150 180 L210 125')],['Fiore di primavera','Stagioni',[3,4,5],path('M150 145 V280 M150 235 Q75 175 70 230 Q100 265 150 235 M150 255 Q225 195 230 245 Q190 280 150 255')+circle(150,105,28)+circle(150,48,29)+circle(204,85,29)+circle(185,145,29)+circle(115,145,29)+circle(96,85,29)],['Orsetto','Animali',[3,4,5],circle(85,65,32)+circle(215,65,32)+circle(150,140,90)+circle(115,125,6)+circle(185,125,6)+circle(150,165,32)+path('M140 153 Q150 145 160 153 L150 165 Z M150 165 Q135 185 125 170 M150 165 Q165 185 175 170')],['Farfalla','Animali',[4,5],path('M140 145 C15 -5 0 170 140 180 C15 280 130 310 145 195 M160 145 C285 -5 300 170 160 180 C285 280 170 310 155 195 M150 120 Q110 50 90 65 M150 120 Q190 50 210 65')+`<el const svg=s=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="white" stroke="black" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">${s}</svg>`;let favorites=[];try{favorites=JSON.parse(localStorage.getItem('teresa-fav')||'[]')}catch{}let only=false;const $=id=>document.getElementById(id);function render(){let n=0;$('grid').innerHTML='';data.forEach(([name,c,ages,s,instruction],i)=>{if(($('cat').value!=='Tutte'&&$('cat').value!==c)||($('age').value!=='all'&&!ages.includes(+$('age').value))||!name.toLowerCase().includes($('q').value.toLowerCase())||(only&&!favorites.includes(i)))return;n++;let a=document.createElement('article');a.innerHTML=svg(s)+`<h3>${name}</h3><small>${c} · ${ages.join(', ')} anni</small><p>${instruction||"Colora il disegno."}</p><div class="actions"><button onclick="printSheet(${i})">🖨 Stampa A4</button><button aria-label="Preferito" onclick="toggle(${i})">${favorites.includes(i)?'♥':'♡'}</button></div>`;$('grid').append(a)});$('count').textContent=n+' schede disponibili'}function toggle(i){favorites=favorites.includes(i)?favorites.filter(x=>x!==i):[...favorites,i];try{localStorage.setItem('teresa-fav',JSON.stringify(favorites))}catch{}render()}function printSheet(i){$('sheet').innerHTML=`<h2>${data[i][0]}</h2><p>Nome: __________________________</p><p>${data[i][4]||"Colora il disegno."}</p>${svg(data[i][3])}`;window.print()}$('cat').onchange=$('age').onchange=$('q').oninput=render;$('fav').onclick=()=>{only=!only;$('fav').textContent=only?'♥ Mostra tutte':'♡ Preferiti';render()};render();</script><script>if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(console.error);</script></html>
